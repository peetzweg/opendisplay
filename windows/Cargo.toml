[package]
name = "od-receiver"
version = "0.1.0"
edition = "2024"
description = "Windows receiver for the OpenDisplay wire protocol"
license = "GPL-3.0-only"
repository = "https://github.com/peetzweg/opendisplay"

[[bin]]
name = "fake-sender"
path = "tools/fake-sender/main.rs"

[[bin]]
name = "decode-bench"
path = "tools/decode-bench/main.rs"

[dependencies]
env_logger = "0.11.11"
log = "0.4"
mdns-sd = "0.21.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.5"
uuid = { version = "1.29.0", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Imaging", "Win32_Security_Cryptography", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_System_RemoteDesktop"] }
windows-numerics = "0.3.1"
