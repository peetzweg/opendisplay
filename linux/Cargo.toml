[workspace]
resolver = "3"
members = [
    "crates/opendisplay-proto",
    "crates/opendisplay-session",
    "crates/od-fake-sender",
    "crates/od-receiver",
    "crates/od-sender",
]

[workspace.package]
version = "1.28.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/peetzweg/opendisplay"
rust-version = "1.85"

[workspace.dependencies]
opendisplay-proto = { path = "crates/opendisplay-proto" }
opendisplay-session = { path = "crates/opendisplay-session" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "fs", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
miniz_oxide = "0.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Client code for the KDE protocols in crates/od-sender/protocols.
wayland-scanner = "0.31"
wayland-backend = "0.3"
# Bitfield enums in generated protocol code.
bitflags = "2"
# KDE: KWin hands virtual outputs out as PipeWire streams.
pipewire = "0.10"
gstreamer = "0.25"
gstreamer-app = "0.25"
# Receiver window: GTK 4 presents the decoded frames (gtk4paintablesink,
# linked in from gst-plugins-rs) and delivers pointer input.
gtk4 = { version = "0.11", features = ["v4_14"] }
gst-plugin-gtk4 = { version = "0.15", features = ["wayland", "dmabuf", "gtk_v4_14"] }
openh264 = { version = "0.9", features = ["source"] }
# Encoder + swscale only; ffmpeg-next needs `format` to compile, never used.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }

# OpenH264 is C++ compiled by `cc` at the profile's opt-level; at -O0 it is
# ~10x slower than release, which makes debug-build sender tests misleading.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Release tarballs ship this binary as is (makepkg strips the AUR build anyway).
strip = "symbols"
