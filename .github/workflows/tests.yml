name: Tests

# Nothing checked pull requests before this, so a branch that did not compile
# (or a test target that could not build) only surfaced on someone's laptop.
on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells us nothing, so drop in-flight runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      # Deliberately without DEVELOPMENT_TEAM: nothing built here is
      # distributed, so an unsigned build is enough, and needing no secrets
      # means this check also runs on pull requests from forks.
      - name: Generate project
        run: xcodegen generate

      # Builds the Mac app as well as the test bundle, since the scheme covers
      # both — so this is a compile check for the app on top of the tests.
      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # The receiver app has a much lower deployment target than the sender
      # (issue #241); building it is what catches an API that only exists on
      # newer macOS sneaking into Shared/ or the receiver.
      - name: Build macOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMacReceiver \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Same runner, Xcode and Ruby setup as the release workflow's build-ios job,
  # so a pull request finds out when that image stops working, not a release.
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Shared protocol/receiver code is also compiled into the universal
      # iPhone+iPad app. Catch a mobile-only compile or asset failure on the
      # change that introduced it, before release-please creates a tag and the
      # release workflow attempts its TestFlight upload.
      - name: Build iOS and iPadOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecariOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # iPhone Duo letterboxes apps built with an iOS SDK older than 27.1.
      - name: Check the iOS SDK
        run: |
          sdk=$(/usr/libexec/PlistBuddy -c "Print :DTPlatformVersion" \
            build/ios/Build/Products/Release-iphoneos/OpenSidecariOS.app/Info.plist)
          echo "Built with the iOS $sdk SDK"
          ruby -e 'exit Gem::Version.new(ARGV[0]) >= Gem::Version.new("27.1")' "$sdk"

      - name: fastlane loads the iOS upload lane
        run: bundle exec fastlane lanes | grep -q "ios beta"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The native AirPlay engine needs SDK 36 and NDK 27; ubuntu-latest does
      # not guarantee either. Pin them here so a PR finds out on the change
      # that introduced the dependency, not during a release build.
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      # The bootstrap downloads pinned FFmpeg, UxPlay, libplist and OpenSSL
      # sources. Cache the tarballs so lint/test reruns do not hit the network
      # again, while the key still changes when the bootstrap or patches change.
      - uses: actions/cache@v4
        with:
          path: Android/app/src/main/cpp/third_party/.downloads
          key: android-airplay-downloads-${{ hashFiles('Android/tools/bootstrap-airplay-third-party.py', 'Android/app/src/main/cpp/patches/UxPlay/*.patch') }}

      # Lint catches a platform API above minSdk 21 without an SDK_INT guard.
      # Assembling with the native engine enabled catches JNI/CMake failures
      # and makes sure the third-party bootstrap still produces a buildable
      # source tree. -PskipAirplayNative is deliberately not used here.
      - name: Unit tests, lint and native debug build
        run: ./gradlew --no-daemon prepareAirplayThirdParty testDebugUnitTest lintDebug assembleDebug

      # assembleRelease runs the release variant's lintVital and resource
      # checks, which otherwise first run in the release workflow after the
      # tag already exists.
      - name: Native release build
        run: ./gradlew --no-daemon assembleRelease

      - name: Google Play bundle (minSdk 24)
        run: ./gradlew --no-daemon bundleRelease -PappMinSdk=24

      # The release workflow uploads that bundle with fastlane on Linux; a
      # lane that no longer loads would otherwise first fail on release day.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: fastlane loads the Play upload lane
        working-directory: .
        run: bundle exec fastlane lanes | grep -q "android play_beta"
