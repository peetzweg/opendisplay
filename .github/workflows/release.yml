name: Release

on:
  push:
    branches: [main]
  # Recovery: build and upload every platform for a release that already
  # exists (release-please created the tag, but a later step failed before
  # the build jobs ran).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v1.26.0
        required: true

permissions:
  contents: write
  pull-requests: write
  # Lets the build-mac job dispatch the Pages deploy after committing the
  # Sparkle appcast (a GITHUB_TOKEN push won't auto-trigger pages.yml).
  actions: write

# Serialize release runs on the same ref so two quick merges can't race two
# uploads. Never cancel an in-flight run — it may be mid-upload to TestFlight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.rp.outputs.release_created || steps.rp2.outputs.release_created || steps.rp3.outputs.release_created }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.rp.outputs.tag_name || steps.rp2.outputs.tag_name || steps.rp3.outputs.tag_name }}
    steps:
      # Manifest mode (release-please-config.json, .release-please-manifest.json)
      # only to bump linux/Cargo.toml and linux/Cargo.lock with the app
      # version: one `simple` package at the root, tags stay `vX.Y.Z`.
      #
      # GitHub's GraphQL API intermittently answers release-please's commit
      # query with "Something went wrong while executing your query" (seen
      # after the large #298 merge). Retry twice; a release that was created
      # before a failure is picked up as already tagged, so its builds would
      # be skipped: rebuild it with the workflow_dispatch entry below.
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: rp
        continue-on-error: true
      - if: github.event_name == 'push' && steps.rp.outcome == 'failure'
        run: sleep 30
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push' && steps.rp.outcome == 'failure'
        id: rp2
        continue-on-error: true
      - if: github.event_name == 'push' && steps.rp2.outcome == 'failure'
        run: sleep 60
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push' && steps.rp2.outcome == 'failure'
        id: rp3
      - name: Check the release to rebuild exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a vX.Y.Z tag: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  build-ios:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate

      - name: Set up SSH for match certs repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build iOS app and upload to TestFlight
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export APP_MARKETING_VERSION="${TAG_NAME#v}"
          bundle exec fastlane ios beta

  # Linux sender tarballs and receiver Flatpak bundles, attached to the same
  # GitHub release; the job also appends the Linux install notes to it. One
  # version for every platform: the tag above is the Linux version too.
  build-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The called workflow's upload job needs to write the release.
    permissions:
      contents: write
    uses: ./.github/workflows/linux-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  build-mac:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    # The `secrets` context can't be referenced in a step-level `if:` (it's a
    # workflow-validation error). Map the Sparkle key to a job env var so the
    # appcast step can guard on its presence via the allowed `env` context.
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate

      - name: Set up SSH for match certs repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build notarized macOS app
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export APP_MARKETING_VERSION="${TAG_NAME#v}"
          bundle exec fastlane mac build_release
          bundle exec fastlane mac build_receiver_release

      # Both Mac apps ship on every release: the sender (macOS 14+) and the
      # standalone receiver (macOS 12+, issue #241).
      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            build/export/OpenDisplay.dmg \
            build/export/OpenDisplayReceiver.dmg

      # --- Sparkle auto-update: generate + publish the appcasts (issue #52) ---
      # Builds appcast.xml (sender) and appcast-receiver.xml (receiver app)
      # from the just-released, notarized DMGs and commits them to public/ on
      # main. One feed per app: each bundle has its own SUFeedURL, and a mixed
      # feed would offer the wrong app's update. The Pages workflow (pages.yml) triggers
      # on public/** changes, copies public/ into docs/ via the Vite build, and
      # deploys it — so https://opendisplay.app/appcast.xml (the SUFeedURL in
      # project.yml) resolves.
      #
      # No-ops gracefully until the maintainer adds the SPARKLE_PRIVATE_KEY
      # secret (the EdDSA private key from Sparkle's `generate_keys`), so this
      # never hard-fails a release before auto-update is switched on.
      - name: Publish Sparkle appcast to GitHub Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          # Sparkle release that ships the generate_appcast / sign_update tools.
          SPARKLE_TOOLS_VERSION: "2.6.4"
        run: |
          set -euo pipefail

          # Sparkle's CLI tools (generate_appcast, sign_update) ship in the
          # official release tarball — download the matching version.
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          GEN_APPCAST="$(find /tmp/sparkle -name generate_appcast -type f | head -1)"
          echo "Using $GEN_APPCAST"

          # The EdDSA private key (CI secret) → file for --ed-key-file.
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_ed_priv

          # generate_appcast wants a directory of update archives per feed.
          # Point the download links at the GitHub Release assets where the
          # DMGs live.
          mkdir -p /tmp/appcast-updates /tmp/appcast-receiver-updates
          cp build/export/OpenDisplay.dmg /tmp/appcast-updates/
          cp build/export/OpenDisplayReceiver.dmg /tmp/appcast-receiver-updates/

          "$GEN_APPCAST" \
            --ed-key-file /tmp/sparkle_ed_priv \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            -o /tmp/appcast-updates/appcast.xml \
            /tmp/appcast-updates
          "$GEN_APPCAST" \
            --ed-key-file /tmp/sparkle_ed_priv \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            -o /tmp/appcast-receiver-updates/appcast-receiver.xml \
            /tmp/appcast-receiver-updates

          # Commit the feed into public/ on main; Pages picks it up from there.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p public
          cp /tmp/appcast-updates/appcast.xml public/appcast.xml
          cp /tmp/appcast-receiver-updates/appcast-receiver.xml public/appcast-receiver.xml
          rm -f /tmp/sparkle_ed_priv
          git add public/appcast.xml public/appcast-receiver.xml
          # Compare the STAGED files: plain `git diff` ignores untracked files,
          # so the first-ever appcast (a brand-new public/appcast.xml) looked
          # "unchanged" and was never committed. `--cached` sees the staged add.
          if ! git diff --cached --quiet -- public/appcast.xml public/appcast-receiver.xml; then
            git commit -m "chore(release): publish Sparkle appcasts for ${TAG_NAME} [skip ci]"
            git push origin main
            # Pushes made with GITHUB_TOKEN do NOT trigger other workflows
            # (GitHub blocks recursive runs), so kick the Pages deploy
            # explicitly via its workflow_dispatch entry point.
            gh workflow run pages.yml --ref main || \
              echo "could not dispatch pages.yml — deploy it manually"
          else
            echo "appcast.xml unchanged — nothing to publish"
          fi

  # Android receiver: a signed APK attached to the same GitHub release as the
  # DMGs, so releases/latest/download/OpenDisplay-Android.apk (the website's
  # download link) always resolves. Gradle builds it unsigned; apksigner signs
  # it here, so the keystore never touches the Gradle config or the repo.
  build-android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Same rule as build-mac: `secrets` can't appear in a step `if:`, so map
    # the keystore to a job env var and guard on that. Until the maintainer
    # adds the ANDROID_* secrets, this job builds but uploads nothing.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # versionName is the release tag; versionCode is derived from it as
      # major*1000000 + minor*10000 + patch*100 + rebuild (1.26.0 -> 1260000)
      # so it only ever grows. CI always uses rebuild 0; the last two digits
      # leave room for manual Play re-uploads of the same version, since Play
      # never frees a versionCode once used.
      # Needs the -PappVersionName/-PappVersionCode hook in app/build.gradle.kts.
      - name: Build release APK (unsigned)
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$CODE"

      # minSdk 21 needs the v1 (JAR) signature for Android 5 and 6; apksigner
      # adds it on its own because it reads minSdk from the APK.
      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using $BUILD_TOOLS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/OpenDisplay-Android.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/OpenDisplay-Android.apk
          (cd dist && sha256sum OpenDisplay-Android.apk > OpenDisplay-Android.apk.sha256)

      - name: Upload APK to release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/OpenDisplay-Android.apk \
            dist/OpenDisplay-Android.apk.sha256

      - name: Report skipped upload
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so no APK was attached to this release."

  # Google Play: the same release as an Android App Bundle on a testing track,
  # like build-ios does for TestFlight. Production stays a manual promotion in
  # Play Console. Play only accepts minSdk 24, so this build raises it; the
  # GitHub APK above keeps 21. The bundle is signed with the UPLOAD key
  # (upload.jks), not the app signing key: Play checks the upload signature
  # and re-signs with its own key. Inactive until the PLAY_* and
  # ANDROID_UPLOAD_* secrets exist; see RELEASING.md.
  upload-play:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Report skipped upload
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' || env.ANDROID_UPLOAD_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON or ANDROID_UPLOAD_KEYSTORE_BASE64 is not set, so nothing was uploaded to Google Play."

      - uses: actions/checkout@v6
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v5
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        with:
          distribution: temurin
          java-version: 17

      # Same versionCode formula as build-android, so the Play build and the
      # APK of one release share it.
      - name: Build Play bundle (minSdk 24)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        working-directory: Android
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          ./gradlew --no-daemon bundleRelease -PappMinSdk=24 \
            -PappVersionName="$VERSION" -PappVersionCode="$CODE"

      - name: Sign bundle with the upload key
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p dist
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar dist/OpenDisplay-play.aab \
            Android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_UPLOAD_KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          jarsigner -verify dist/OpenDisplay-play.aab

      - uses: ruby/setup-ruby@v1
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # PLAY_TRACK (repository variable) names the testing track; "alpha" is
      # the API name of Play Console's default closed testing track.
      - name: Upload to Google Play
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          PLAY_AAB_PATH: ${{ github.workspace }}/dist/OpenDisplay-play.aab
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: bundle exec fastlane android play_beta
